name: build-windows-v2-batch

on:
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based offset into the reviewed batch list
        required: true
        default: "0"
      limit:
        description: Number of packages in this batch (keep artifact/disk use bounded)
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.slice.outputs.matrix }}
      count: ${{ steps.slice.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Slice the reviewed batch
        id: slice
        env:
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          case "$OFFSET" in ''|*[!0-9]*) echo '::error::offset must be a non-negative integer'; exit 1 ;; esac
          case "$LIMIT" in ''|*[!0-9]*|0) echo '::error::limit must be a positive integer'; exit 1 ;; esac
          python runtime-windows/ci/slice_v2_batch.py

  repack:
    needs: prepare
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full jq
      - name: Download and verify public v1 input
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
        run: |
          set -euo pipefail
          mkdir input
          source_filename="$(basename "${SOURCE_URL}")"
          [[ "${source_filename}" != "-" && "${source_filename}" != */* ]] || { echo "::error::Invalid source basename"; exit 1; }
          curl --fail --location --retry 3 --output "input/${source_filename}" "${SOURCE_URL}"
          actual="$(sha256sum "input/${source_filename}" | awk '{print $1}')"
          [[ "${actual}" == "${SOURCE_SHA256}" ]] || { echo "::error::Source SHA256 mismatch"; exit 1; }
      - name: Repack Windows v2 payload
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ matrix.version }}
          SOURCE_URL: ${{ matrix.source_url }}
          SOURCE_SHA256: ${{ matrix.source_sha256 }}
          MINIMUM_OS: ${{ matrix.minimum_os }}
          PRODUCER_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source_filename="$(basename "${SOURCE_URL}")"
          source_bytes="$(wc -c < "input/${source_filename}")"
          jq -n \
            --arg path "input/${source_filename}" \
            --arg version "${VERSION}" \
            --arg sha256 "${SOURCE_SHA256}" \
            --arg url "${SOURCE_URL}" \
            --argjson bytes "${source_bytes}" \
            '{path:$path,version:$version,sha256:$sha256,bytes:$bytes,url:$url}' > source.json
          jq -n \
            --arg name "${PKG}" \
            --arg version "${VERSION}" \
            '{runtime_version:"v2",os:"windows",kind:"package",name:$name,version:$version,arch:"x64",build_revision:0}' > identity.json
          jq -n \
            --arg commit "${PRODUCER_COMMIT}" \
            --arg run_id "${RUN_ID}" \
            --argjson run_attempt "${RUN_ATTEMPT}" \
            '{commit:$commit,run_id:$run_id,run_attempt:$run_attempt}' > producer.json
          python runtime-windows/repack_v2.py \
            --source source.json \
            --identity identity.json \
            --producer producer.json \
            --minimum-os "${MINIMUM_OS}" \
            --output-dir v2-output \
            --seven-zip /usr/bin/7z
          test -s v2-output/meta.json
          test -s v2-output/repack-manifest.json
          test -n "$(find v2-output -maxdepth 1 -type f -name '*.7z' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg2-windows-x86_64-package-${{ matrix.pkg }}-${{ matrix.version }}
          if-no-files-found: error
          path: v2-output/**
          retention-days: 14
