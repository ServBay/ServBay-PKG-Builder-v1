name: build-windows-php-legacy

# Compile an EOL PHP release on Windows from source, with the Visual C++
# toolchain that release targets.
#
# The stock pipeline repackages an upstream zip and therefore cannot apply a
# source patch. Every branch that has to carry a security backport is built
# here instead:
#
#   7.0, 7.1   VC14 (VS2015 toolset, falls back to the newest installed one)
#   7.2 - 7.4  VC15
#   8.0, 8.1   VS16
#
# Everything below 7.0 needs VS2012 (5.5/5.6) or VS2008 (5.3/5.4), neither of
# which is obtainable here.
#
# The output mirrors build-windows.yml's contract exactly - a 7z of the PHP
# release directory plus meta.json - so the downstream Uploader needs no
# special case.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version, e.g. 7.0.33.1'
        required: true
        type: string
      arch:
        description: 'Architecture'
        required: true
        type: choice
        options: [x64, x86]
        default: x64
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      arch:
        type: string
        required: false
        default: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ARCH: ${{ inputs.arch }}
      VERSION: ${{ inputs.version }}
      REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up git and 7-Zip
        shell: pwsh
        run: |
          # git applies the security patches; the SDK's bundled patch 2.5.9
          # aborts on multi-hunk diffs. 7-Zip extracts the official deps archive.
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw 'git is required to apply the security patches'
          }
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            choco install -y 7zip --no-progress
          }
          git --version
          & 'C:\Program Files\7-Zip\7z.exe' | Select-Object -First 2

      - name: Generate extension manifest
        # --enable-snapshot-build only builds the core ext/ modules. The
        # published packages also carry the PECL extensions listed in
        # php-exts.json, so flatten the entry for this branch/arch into the
        # shape the build script expects. Only the same set the stock pipeline
        # installs is taken: php-exts.json also lists extras (phalcon,
        # rdkafka, ...) that the published packages never carried, and adding
        # them would ship unverified runtime dependencies.
        #
        # apcu and grpc are not in php-exts.json but the EOL packages shipped
        # them, so their last builds for each branch are pinned here. 8.1 never
        # had either. com_dotnet, oci8 and pdo_oci come from the official
        # release archive instead - they need the .NET and Oracle SDKs.
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.arch }}
        run: |
          $required = @(
            'imagick', 'xdebug', 'redis', 'apcu', 'yaml', 'memcached',
            'mongodb', 'memcache', 'sqlsrv', 'pdo_sqlsrv', 'msgpack',
            'protobuf', 'grpc', 'oauth', 'igbinary', 'imap'
          )
          $pecl = 'https://downloads.php.net/~windows/pecl/releases'
          $pinned = @{
            '5.6' = @{
              apcu = "$pecl/apcu/4.0.8/php_apcu-4.0.8-5.6-nts-vc11-x64.zip"
            }
            '7.0' = @{
              apcu = "$pecl/apcu/5.1.15/php_apcu-5.1.15-7.0-nts-vc14-x64.zip"
              grpc = "$pecl/grpc/1.17.0/php_grpc-1.17.0-7.0-nts-vc14-x64.zip"
            }
            '7.1' = @{
              apcu = "$pecl/apcu/5.1.18/php_apcu-5.1.18-7.1-nts-vc14-x64.zip"
              grpc = "$pecl/grpc/1.25.0/php_grpc-1.25.0-7.1-nts-vc14-x64.zip"
            }
            '7.2' = @{
              apcu = "$pecl/apcu/5.1.28/php_apcu-5.1.28-7.2-nts-vc15-x64.zip"
              grpc = "$pecl/grpc/1.30.0/php_grpc-1.30.0-7.2-nts-vc15-x64.zip"
            }
            '7.3' = @{
              apcu = "$pecl/apcu/5.1.28/php_apcu-5.1.28-7.3-nts-vc15-x64.zip"
              grpc = "$pecl/grpc/1.40.0/php_grpc-1.40.0-7.3-nts-vc15-x64.zip"
            }
            '7.4' = @{
              apcu = "$pecl/apcu/5.1.28/php_apcu-5.1.28-7.4-nts-vc15-x64.zip"
              grpc = "$pecl/grpc/1.40.0/php_grpc-1.40.0-7.4-nts-vc15-x64.zip"
            }
            '8.0' = @{
              apcu = "$pecl/apcu/5.1.28/php_apcu-5.1.28-8.0-nts-vs16-x64.zip"
              grpc = "$pecl/grpc/1.84.0/php_grpc-1.84.0-8.0-nts-vs16-x64.zip"
            }
          }
          $table = Get-Content 'runtime-windows\php-exts.json' -Raw | ConvertFrom-Json
          $branch = ($env:VERSION -split '\.')[0..1] -join '.'
          $manifest = @{}
          foreach ($name in $required) {
            $package = $table.PSObject.Properties[$name]
            if (-not $package) { continue }
            $entry = $package.Value.PSObject.Properties[$branch]
            if (-not $entry) { continue }
            $value = $entry.Value
            if ($value.arch -eq $env:ARCH -and $value.download_url) {
              $manifest[$name] = $value.download_url
            }
          }
          if ($pinned.ContainsKey($branch)) {
            foreach ($name in $pinned[$branch].Keys) {
              $manifest[$name] = $pinned[$branch][$name]
            }
          }
          # 5.5 was published without any PECL extension, and PECL only offers
          # a handful of VC11 builds for it. Shipping the core set alone keeps
          # the package at parity with the one it replaces; an empty manifest
          # is expected there. Every other branch must have extensions.
          $coreOnly = @('5.3', '5.4', '5.5')
          if ($manifest.Count -eq 0) {
            if ($branch -notin $coreOnly) {
              throw "No PECL extensions defined for PHP $branch ($env:ARCH)"
            }
            Write-Host "PHP $branch ($env:ARCH) ships the core extensions only"
            '{}' | Set-Content -Path 'ext-manifest.json' -Encoding ASCII
            exit 0
          }
          $manifest | ConvertTo-Json | Set-Content -Path 'ext-manifest.json' -Encoding ASCII
          Write-Host "PHP $branch ($env:ARCH) extensions: $(($manifest.Keys | Sort-Object) -join ', ')"

      - name: Build PHP
        shell: pwsh
        run: |
          $patchRoot = Join-Path $env:REPO_ROOT 'runtime\patch'
          $major = ($env:VERSION -split '\.')[0..1] -join '.'
          $patchDir = Join-Path $patchRoot "php$major"
          if (-not (Test-Path $patchDir)) {
            throw "No patch directory for PHP $major at $patchDir"
          }

          # The shim has to live outside the source tree so it cannot be
          # mistaken for a PHP source file.
          $root = 'C:\phplegacy'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item (Join-Path $env:REPO_ROOT 'runtime-windows\ci\vc14-intrinsics.h') `
                    (Join-Path $root 'vc14-intrinsics.h') -Force

          $outDir = Join-Path $env:REPO_ROOT "dist-windows\php\$env:ARCH"
          $script = Join-Path $env:REPO_ROOT 'runtime-windows\ci\build_php_legacy.ps1'
          & $script -Version $env:VERSION -Arch $env:ARCH -OutputDir $outDir -PatchDir $patchDir `
                    -ExtManifest (Join-Path $env:REPO_ROOT 'ext-manifest.json')

      - name: Generate meta.json
        id: meta
        shell: pwsh
        run: |
          $dir = Join-Path $env:REPO_ROOT "dist-windows\php\$env:ARCH"
          # PHP 5.3/5.4 compile x86 but are published under the x64 identity.
          $packageArch = if ($env:VERSION -match '^5\.[34]\.') { 'x64' } else { $env:ARCH }
          $filename = "php-$env:VERSION-windows-$packageArch.7z"
          $path = Join-Path $dir $filename
          if (-not (Test-Path $path)) {
            Get-ChildItem -Recurse (Join-Path $env:REPO_ROOT 'dist-windows') | Out-String | Write-Host
            throw "Expected package not found: $path"
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
          @{
            name = 'php'
            version = $env:VERSION
            arch = $packageArch
            os = 'windows'
            sha256 = $sha256
            filename = $filename
          } | ConvertTo-Json -Compress | Set-Content -Path (Join-Path $dir 'meta.json') -Encoding ASCII
          Get-Content (Join-Path $dir 'meta.json')
          "pkg_dir=$dir" >> $env:GITHUB_OUTPUT
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "package_arch=$packageArch" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-${{ steps.meta.outputs.package_arch }}-php-${{ env.VERSION }}
          path: |
            ${{ steps.meta.outputs.pkg_dir }}/${{ steps.meta.outputs.filename }}
            ${{ steps.meta.outputs.pkg_dir }}/meta.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify v2 split assets
        shell: pwsh
        env:
          PKG_DIR: ${{ steps.meta.outputs.pkg_dir }}
          PACKAGE_ARCH: ${{ steps.meta.outputs.package_arch }}
        run: |
          $split = Join-Path $env:PKG_DIR 'split'
          $manifestPath = Join-Path $split 'split-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw "Missing split manifest: $manifestPath" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $coreDir = Join-Path $split "php-build-artifacts-$env:PACKAGE_ARCH-nts"
          foreach ($name in @($manifest.core.filename, $manifest.devel.filename)) {
            $path = Join-Path $coreDir $name
            if (-not (Test-Path $path)) { throw "Missing split core asset: $path" }
          }
          if ($null -eq $manifest.extensions) { throw 'Split manifest has no extensions field' }
          foreach ($extension in @($manifest.extensions)) {
            $path = Join-Path $split "extensions\extension-$($extension.name)-$env:VERSION-$env:PACKAGE_ARCH-nts\$($extension.filename)"
            if (-not (Test-Path $path)) { throw "Missing split extension asset: $path" }
          }
          Write-Host "Split extensions: $(@($manifest.extensions).Count)"
          $manifest | ConvertTo-Json -Depth 6 | Write-Host

      - name: Upload v2 core split artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-build-artifacts-${{ steps.meta.outputs.package_arch }}-nts
          path: ${{ steps.meta.outputs.pkg_dir }}/split/php-build-artifacts-${{ steps.meta.outputs.package_arch }}-nts/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2 extension split artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-extensions-${{ steps.meta.outputs.package_arch }}-nts
          path: ${{ steps.meta.outputs.pkg_dir }}/split/extensions/extension-*
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload v2 split manifest
        uses: actions/upload-artifact@v4
        with:
          name: php-split-manifest-${{ steps.meta.outputs.package_arch }}-nts
          path: ${{ steps.meta.outputs.pkg_dir }}/split/split-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-${{ env.ARCH }}-php-${{ env.VERSION }}
          path: |
            C:\phplegacy\**\*.log
          if-no-files-found: warn
          retention-days: 7
