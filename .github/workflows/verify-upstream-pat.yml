name: verify-upstream-pat

on:
  workflow_dispatch:

# The control token must have no cross-repository Actions write permission.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stored PAT without starting upstream jobs
        shell: python
        env:
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_DISPATCH_PAT }}
          CONTROL_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid

          TARGETS = (
              ("Apache-Windows-Portable", "build-apache-windows.yml"),
              ("Memcached-Windows-Portable", "build-memcached-windows.yml"),
              ("Ollama-Windows-Portable", "build_ollama_windows.yml"),
              ("OpenSSL-Windows-Portable", "build-openssl-windows.yml"),
              ("PHP-Windows-Portable", "build.yml"),
              ("Python-Windows-Portable", "package_python_install.yml"),
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(token, path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              }
              req = urllib.request.Request("https://api.github.com/" + path,
                                           data=data, headers=headers, method=method)
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(req, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              except (OSError, urllib.error.URLError):
                  return 0, {}
              with response:
                  try:
                      body = json.loads(response.read())
                  except (ValueError, OSError):
                      body = {}
                  return response.code, body

          def verify(token, control, api=request):
              if not token or not control:
                  raise RuntimeError("Required secret/control token is missing")
              status, actor = api(token, "user")
              if status != 200 or not isinstance(actor, dict) or not actor.get("login"):
                  raise RuntimeError("PAT authentication failed; HTTP " + str(status))
              report = {"authentication": "PASS", "repositories": []}
              # An absent ref prevents execution. The independent control rejects
              # the same request before ref validation; otherwise do not infer a permission.
              probe = "__servbay_pat_permission_probe_" + uuid.uuid4().hex
              for repo, workflow in TARGETS:
                  base = "repos/ServBay/" + repo
                  for kind in ("heads", "tags"):
                      status, _ = api(token, base + "/git/ref/" + kind + "/" + probe)
                      if status != 404:
                          raise RuntimeError(repo + ": probe ref absence was not confirmed")
                  endpoint = base + "/actions/workflows/" + workflow
                  status, info = api(token, endpoint)
                  if status != 200 or not isinstance(info, dict) or info.get("state") != "active":
                      raise RuntimeError(repo + ": workflow read failed; HTTP " + str(status))
                  payload = {"ref": probe}
                  control_status, _ = api(control, endpoint + "/dispatches", "POST", payload)
                  if control_status not in (403, 404):
                      raise RuntimeError(repo + ": control was inconclusive; HTTP " + str(control_status))
                  status, body = api(token, endpoint + "/dispatches", "POST", payload)
                  if (status != 422 or not isinstance(body, dict)
                          or body.get("message") != "No ref found for: " + probe):
                      raise RuntimeError(repo + ": dispatch permission probe failed; HTTP " + str(status))
                  status, runs = api(token, base + "/actions/runs?branch=" + probe)
                  if (status != 200 or not isinstance(runs, dict)
                          or runs.get("total_count") != 0 or runs.get("workflow_runs") != []):
                      raise RuntimeError(repo + ": zero probe runs was not confirmed")
                  report["repositories"].append({
                      "repo": "ServBay/" + repo,
                      "workflow_read": "PASS",
                      "dispatch_permission_probe": "PASS",
                      "control_http": control_status,
                      "probe_http": 422,
                      "probe_runs": 0,
                  })
              return report

          if __name__ == "__main__":
              try:
                  result = verify(os.environ.pop("UPSTREAM_PAT", ""),
                                  os.environ.pop("CONTROL_TOKEN", ""))
              except RuntimeError as error:
                  print(str(error))
                  sys.exit(1)
              print(json.dumps(result, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("PAT authentication: PASS\n\n")
                  for row in result["repositories"]:
                      summary.write(row["repo"] + ": workflow read and dispatch permission probe PASS; probe runs=0\n\n")
