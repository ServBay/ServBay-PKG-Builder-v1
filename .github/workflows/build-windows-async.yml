name: build-windows-async

# Async finish for slow upstream Windows builds. build-windows.yml dispatches
# compiles that take hours (ollama: llama.cpp + two CUDA toolchains, 3.5-4.5h
# observed on 2026-10-24) without blocking a runner; the upstream workflow
# fires repository_dispatch "upstream-release-ready" once its release is
# published, and this workflow repackages through the same reusable
# build-windows pipeline (identical artifact naming and meta.json contract),
# then signals the Uploader with this run's id. If the callback is ever lost,
# the nightly's release-already-built path self-heals within one tick.
on:
  repository_dispatch:
    types: [upstream-release-ready]

permissions:
  contents: read

# One async package at a time; repeated upstream callbacks queue instead of
# racing on the same dist-windows output.
concurrency:
  group: build-windows-async-${{ github.event.client_payload.pkg }}
  cancel-in-progress: false

jobs:
  validate:
    # The dispatch payload is untrusted: whitelist the package and constrain
    # every field before it reaches build_windows or the Uploader dispatch.
    # Payload values are consumed via env only, never interpolated into run:.
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.check.outputs.pkg }}
      version: ${{ steps.check.outputs.version }}
      arch: ${{ steps.check.outputs.arch }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    env:
      PKG: ${{ github.event.client_payload.pkg }}
      VERSION: ${{ github.event.client_payload.version }}
      ARCH: ${{ github.event.client_payload.arch }}
      DRY_RUN: ${{ github.event.client_payload.dry_run }}
    steps:
      - name: Validate payload
        id: check
        run: |
          set -euo pipefail
          case "$PKG" in
            ollama) ;;
            *) echo "::error::unsupported async pkg=${PKG}"; exit 1 ;;
          esac
          case "$ARCH" in
            x64) ;;
            *) echo "::error::unsupported async arch=${ARCH}"; exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::invalid version=${VERSION}"; exit 1
          fi
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "::warning::dry_run missing/invalid; defaulting to true"; DRY_RUN=true ;;
          esac
          {
            echo "pkg=${PKG}"
            echo "version=${VERSION}"
            echo "arch=${ARCH}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    # Stage 1 of the reusable pipeline sees the release already built and goes
    # straight to Stage 2; upload_dry_run only matters if Stage 1 ever had to
    # re-dispatch upstream, and then the new build keeps this round's mode.
    uses: ./.github/workflows/build-windows.yml
    with:
      pkg: ${{ needs.validate.outputs.pkg }}
      version: ${{ needs.validate.outputs.version }}
      arch: ${{ needs.validate.outputs.arch }}
      upload_dry_run: ${{ needs.validate.outputs.dry_run }}
    secrets: inherit

  notify:
    # Same v1 hand-off contract as dispatch-downstream: Uploader fetches the
    # pkg-* artifacts of this run by run_id (reusable-workflow jobs share the
    # caller's run_id, so the artifact lands on this run).
    needs: [validate, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Signal downstream to fetch and publish
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || secrets.TARGET_REPO }}
          RUN_ID: ${{ github.run_id }}
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
        run: |
          set -euo pipefail
          : "${DISPATCH_PAT:?DISPATCH_PAT secret is not set}"
          : "${TARGET_REPO:?TARGET_REPO variable/secret is not set}"
          payload="$(python3 - <<'PY'
          import json, os
          data = {'run_id': os.environ['RUN_ID'], 'dry_run': os.environ['DRY_RUN']}
          print(json.dumps({'event_type': 'builder-build-complete', 'client_payload': data}))
          PY
          )"
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${DISPATCH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "$payload"
