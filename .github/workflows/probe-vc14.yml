name: probe-vc14

# Temporary diagnostic: does the hosted runner accept the VC.140 component?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Before
        shell: pwsh
        run: |
          $vsw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $inst = & $vsw -products '*' -format json | ConvertFrom-Json
          foreach ($i in $inst) {
            "INSTANCE: $($i.installationPath) $($i.installationVersion)"
            $m = Join-Path $i.installationPath 'VC\Tools\MSVC'
            if (Test-Path $m) { Get-ChildItem $m -Directory | ForEach-Object { "  TOOLSET: $($_.Name)" } }
          }
          "SETUP_EXE: $(Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'))"

      - name: Modify
        shell: pwsh
        timeout-minutes: 15
        run: |
          $InstallerDir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vsw = Join-Path $InstallerDir 'vswhere.exe'
          $inst = (& $vsw -products '*' -format json | ConvertFrom-Json) |
                  Where-Object { Test-Path (Join-Path $_.installationPath 'VC\Tools\MSVC') } |
                  Select-Object -First 1
          $vsPath = $inst.installationPath
          "modifying $vsPath"
          & (Join-Path $InstallerDir 'setup.exe') modify --installPath $vsPath `
              --quiet --norestart --nocache `
              --add Microsoft.VisualStudio.Component.VC.140 2>&1 | ForEach-Object { $_ }
          "setup.exe exit code: $LASTEXITCODE"

      - name: After
        if: always()
        shell: pwsh
        run: |
          $vsw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $inst = & $vsw -products '*' -format json | ConvertFrom-Json
          foreach ($i in $inst) {
            $m = Join-Path $i.installationPath 'VC\Tools\MSVC'
            if (Test-Path $m) { Get-ChildItem $m -Directory | ForEach-Object { "TOOLSET: $($_.Name)" } }
          }
