name: build-and-dispatch

# Orchestrator: build the requested package(s), then signal the downstream
# repository to fetch and publish this run's artifacts.
#
# macOS and Windows are independent: each takes its OWN package + version (they
# need not match), because the mechanics differ — macOS compiles from source,
# Windows repackages an already-built upstream / downloads a prebuilt release.
# `targets` selects which platform(s) to run.
on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: 'macOS runtime generation (v2 requires targets=macos)'
        type: choice
        options: [v1, v2]
        default: v1
      build_revision:
        description: 'Explicit macOS v2 rebuild revision'
        type: number
        default: 0
      targets:
        description: 'Platforms to build'
        type: choice
        options: [both, macos, windows]
        default: both
      macos_pkg:
        description: 'macOS package name (when building macOS)'
        type: string
        required: false
        default: ''
      macos_version:
        description: 'macOS package version'
        type: string
        required: false
        default: ''
      # Needed to repair a half-published package: when one arch's matrix leg fails,
      # dispatch-downstream still publishes the arch that DID produce an artifact.
      # Rebuilding with 'all' would re-upload the already-published arch, so pin the
      # rebuild to the missing one. 'all' keeps the previous behaviour.
      macos_arch:
        description: 'macOS architecture (all = both; pin one to avoid re-publishing the other)'
        type: choice
        options: [all, x86_64, arm64]
        default: all
      host_request:
        description: 'Internal v2 independent-module host request (public catalog identity)'
        type: string
        default: ''
      windows_pkg:
        description: 'Windows package name (when building Windows)'
        type: string
        required: false
        default: ''
      windows_version:
        description: 'Windows package version'
        type: string
        required: false
        default: ''
      windows_arch:
        description: 'Windows architecture'
        type: choice
        options: [x64, x86, arm64]
        default: x64
      windows_version_type:
        description: 'php only: stable | testing | development (ignored otherwise)'
        type: string
        required: false
        default: stable
      upload_dry_run:
        description: 'Pass dry_run=true to Uploader'
        type: boolean
        required: false
        default: true

# build-macos.yml (the reusable workflow this orchestrator calls) needs to
# write repository contents and read artifacts. A called workflow can never be
# granted more than its caller, and GitHub rejects the whole dispatch at
# startup when it asks for more - so this ceiling has to cover it.
permissions:
  contents: write
  actions: read

jobs:
  plan-macos:
    if: ${{ inputs.runtime_version == 'v2' || inputs.targets == 'both' || inputs.targets == 'macos' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.plan.outputs.commit }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install requests
      - id: plan
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          TARGETS: ${{ inputs.targets }}
          PKG: ${{ inputs.macos_pkg }}
          VERSION: ${{ inputs.macos_version }}
          ARCH: ${{ inputs.macos_arch }}
          REVISION: ${{ inputs.build_revision }}
          GH_TOKEN: ${{ github.token }}
          HOST_REQUEST: ${{ inputs.host_request }}
        run: |
          set -euo pipefail
          if [ "$RUNTIME_VERSION" = v2 ] && [ "$TARGETS" != macos ]; then
            echo '::error::Select targets=macos for the macOS v2 profile.'
            exit 1
          fi
          if [ -n "${HOST_REQUEST:-}" ]; then
            [ "$RUNTIME_VERSION" = v2 ] || exit 1
            export CHECKOUT_SHA="$(git rev-parse HEAD)"
            python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'runtime/ci')
          import build_control
          build_control.run_decision('v2', False, False, True, os.environ['GITHUB_SHA'], os.environ['CHECKOUT_SHA'])
          PYCODE
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 runtime/ci/build_profile.py matrix --runtime-version "$RUNTIME_VERSION" \
            --pkg "$PKG" --version "$VERSION" --arch "$ARCH" \
            --build-revision "$REVISION" --output matrix.json
          /bin/bash runtime/ci/reserve_builds.sh

  build-macos:
    # 只传已验证的参数。2026-10-24 实测：往 `with` 里再加 `checkout_ref` /
    # `host_request`（带兜底也一样）会让整个 job **静默不生成** —— run 卡在
    # in_progress，`dispatch-downstream` 等一个永远不存在的 need。
    # `build_revision` 单独加回是安全的，并且 v2 强制重建依赖它。
    #
    # 不传的两个参数由 `build-macos.yml` 的 workflow_call 默认值覆盖：
    #   checkout_ref 默认 '' → 内部回退 `${{ inputs.checkout_ref || github.sha }}`
    #   host_request 默认 ''（独立模块 host 请求走 check-updates.yml，不经本 orchestrator）
    uses: ./.github/workflows/build-macos.yml
    with:
      pkg: ${{ inputs.macos_pkg }}
      version: ${{ inputs.macos_version }}
      arch: ${{ inputs.macos_arch }}
      runtime_version: ${{ inputs.runtime_version }}
      build_revision: ${{ inputs.build_revision || 0 }}
    # Pass repo secrets through so a private upstream (ai-gateway) can authenticate
    # its `gh release download`. Public upstreams ignore them.
    secrets: inherit

  build-windows:
    # EOL PHP branches (5.3-8.1) are compiled from source in
    # build-windows-php-legacy.yml: the stock pipeline repackages an upstream
    # zip and cannot apply the security backport. Everything else stays here.
    if: ${{ inputs.runtime_version != 'v2' && (inputs.targets == 'both' || inputs.targets == 'windows') && !(inputs.windows_pkg == 'php' && (startsWith(inputs.windows_version, '5.3.') || startsWith(inputs.windows_version, '5.4.') || startsWith(inputs.windows_version, '5.5.') || startsWith(inputs.windows_version, '5.6.') || startsWith(inputs.windows_version, '7.0.') || startsWith(inputs.windows_version, '7.1.') || startsWith(inputs.windows_version, '7.2.') || startsWith(inputs.windows_version, '7.3.') || startsWith(inputs.windows_version, '7.4.') || startsWith(inputs.windows_version, '8.0.') || startsWith(inputs.windows_version, '8.1.'))) }}
    uses: ./.github/workflows/build-windows.yml
    with:
      pkg: ${{ inputs.windows_pkg }}
      version: ${{ inputs.windows_version }}
      arch: ${{ inputs.windows_arch }}
      version_type: ${{ inputs.windows_version_type }}
    secrets: inherit

  build-windows-legacy:
    # Same artifact contract as build-windows.yml, so dispatch-downstream picks
    # the result up without a special case.
    if: ${{ inputs.runtime_version != 'v2' && (inputs.targets == 'both' || inputs.targets == 'windows') && inputs.windows_pkg == 'php' && (startsWith(inputs.windows_version, '5.3.') || startsWith(inputs.windows_version, '5.4.') || startsWith(inputs.windows_version, '5.5.') || startsWith(inputs.windows_version, '5.6.') || startsWith(inputs.windows_version, '7.0.') || startsWith(inputs.windows_version, '7.1.') || startsWith(inputs.windows_version, '7.2.') || startsWith(inputs.windows_version, '7.3.') || startsWith(inputs.windows_version, '7.4.') || startsWith(inputs.windows_version, '8.0.') || startsWith(inputs.windows_version, '8.1.')) && (inputs.windows_arch == 'x64' || inputs.windows_arch == 'x86') }}
    uses: ./.github/workflows/build-windows-php-legacy.yml
    with:
      version: ${{ inputs.windows_version }}
      arch: ${{ inputs.windows_arch }}

  collect-macos-v2:
    needs: [plan-macos, build-macos]
    if: ${{ always() && inputs.runtime_version == 'v2' && needs.plan-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      ready_count: ${{ steps.collect.outputs.ready_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-macos.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_COMMIT: ${{ needs.plan-macos.outputs.commit }}
          INCLUDE_CURRENT_RUN_MODULES: 'true'
          BUILD_RECORDS_JSON: ${{ needs.plan-macos.outputs.matrix }}
        run: /bin/bash runtime/ci/collect_builds.sh

  dispatch-downstream:
    needs: [plan-macos, build-macos, build-windows, build-windows-legacy, collect-macos-v2]
    # Fire when the platform(s) we actually ran succeeded — a platform skipped by
    # `targets` is fine — and at least one produced artifacts. Never on a real
    # failure/cancellation. `always()` is required so a skipped need doesn't skip
    # this job too.
    if: >-
      ${{ always() && (
          (inputs.runtime_version == 'v2' && needs.collect-macos-v2.result == 'success'
            && needs.collect-macos-v2.outputs.ready_count != '0')
          || (inputs.runtime_version != 'v2'
            && needs.build-macos.result != 'failure' && needs.build-macos.result != 'cancelled'
            && needs.build-windows.result != 'failure' && needs.build-windows.result != 'cancelled'
            && needs.build-windows-legacy.result != 'failure' && needs.build-windows-legacy.result != 'cancelled'
            && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success'
                || needs.build-windows-legacy.result == 'success')) ) }}
    runs-on: ubuntu-latest
    steps:
      # On build success, fire a repository_dispatch in the downstream repo so it
      # fetches this run's artifacts and publishes them. The target repo and token
      # come from Secrets — no repo name or credential appears in this public
      # workflow. All values go through env (never inlined into the run text) so
      # nothing is interpolated into the shell command.
      - name: Signal downstream to fetch & publish
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || secrets.TARGET_REPO }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          PRODUCER_COMMIT: ${{ needs.plan-macos.outputs.commit }}
          DRY_RUN: ${{ inputs.upload_dry_run }}
        run: |
          set -euo pipefail
          : "${DISPATCH_PAT:?DISPATCH_PAT secret is not set}"
          : "${TARGET_REPO:?TARGET_REPO variable/secret is not set}"
          payload="$(python3 - <<'PY'
          import json, os
          data = {'run_id': os.environ['RUN_ID'], 'dry_run': os.environ['DRY_RUN']}
          if os.environ['RUNTIME_VERSION'] == 'v2':
              data.update(runtime_version='v2', os='macos', run_attempt=int(os.environ['RUN_ATTEMPT']),
                          producer_commit=os.environ['PRODUCER_COMMIT'])
          print(json.dumps({'event_type': 'builder-build-complete', 'client_payload': data}))
          PY
          )"
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${DISPATCH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "$payload"
