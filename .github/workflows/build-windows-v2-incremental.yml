name: build-windows-v2-incremental

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: One explicit ordinary Windows package
        required: true
        type: string
      major:
        description: Explicit v2 series when the package has multiple pending series
        type: string
        default: ''
      minimum_os:
        description: Explicit Windows minimum OS
        type: string
        default: '10.0'
      build_revision:
        description: Explicit API-reviewed unoccupied v2 revision
        type: number
        default: 0
      continue_build:
        description: Build the selected update and notify the private uploader
        type: boolean
        default: false
      upload_dry_run:
        description: Pass dry_run=true to the private uploader
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.select.outputs.count }}
      pkg: ${{ steps.select.outputs.pkg }}
      version: ${{ steps.select.outputs.version }}
      source_url: ${{ steps.select.outputs.source_url }}
      source_sha256: ${{ steps.select.outputs.source_sha256 }}
      minimum_os: ${{ steps.select.outputs.minimum_os }}
      build_revision: ${{ steps.select.outputs.build_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing catalog dependencies
        run: python -m pip install requests packaging
      - name: Select the explicit ordinary update
        id: select
        env:
          PKG: ${{ inputs.pkg }}
          MAJOR: ${{ inputs.major }}
          MINIMUM_OS: ${{ inputs.minimum_os }}
          BUILD_REVISION: ${{ inputs.build_revision || 0 }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/windows-v2-selection.json"
          python runtime-windows/ci/select_v2_update.py \
            --package "$PKG" --major "$MAJOR" --minimum-os "$MINIMUM_OS" \
            --build-revision "$BUILD_REVISION" --output "$plan"
          python - "$plan" <<'PY'
          import json, os, sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text())['include']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('count=' + str(len(rows)) + '\n')
              if rows:
                  for key in ('pkg', 'version', 'source_url', 'source_sha256', 'minimum_os', 'build_revision'):
                      output.write(key + '=' + str(rows[0][key]) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Selected Windows v2 update\n\n')
              summary.write('```json\n' + json.dumps(rows, indent=2) + '\n```\n')
          PY

  repack:
    needs: plan
    if: ${{ inputs.continue_build && needs.plan.outputs.count == '1' }}
    uses: ./.github/workflows/build-windows-v2-package.yml
    with:
      pkg: ${{ needs.plan.outputs.pkg }}
      version: ${{ needs.plan.outputs.version }}
      source_url: ${{ needs.plan.outputs.source_url }}
      source_sha256: ${{ needs.plan.outputs.source_sha256 }}
      minimum_os: ${{ needs.plan.outputs.minimum_os }}
      build_revision: ${{ fromJSON(needs.plan.outputs.build_revision) }}

  notify:
    needs: repack
    if: ${{ needs.repack.result == 'success' && needs.repack.outputs.artifact_name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify the exact Windows schema2 producer
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || secrets.TARGET_REPO }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_COMMIT: ${{ github.sha }}
          DRY_RUN: ${{ inputs.upload_dry_run }}
        run: |
          set -euo pipefail
          : "${DISPATCH_PAT:?DISPATCH_PAT secret is not set}"
          : "${TARGET_REPO:?TARGET_REPO variable or secret is not set}"
          payload="$(python3 - <<'PY'
          import json, os
          if os.environ['DRY_RUN'] not in ('true', 'false'):
              raise ValueError('dry_run must be explicit')
          data = dict(runtime_version='v2', os='windows', kind='package',
                      run_id=os.environ['RUN_ID'], run_attempt=int(os.environ['RUN_ATTEMPT']),
                      producer_commit=os.environ['PRODUCER_COMMIT'], dry_run=os.environ['DRY_RUN'] == 'true')
          print(json.dumps(dict(event_type='builder-build-complete', client_payload=data)))
          PY
          )"
          curl --fail -sS -X POST -H "Authorization: Bearer ${DISPATCH_PAT}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" -d "$payload"
