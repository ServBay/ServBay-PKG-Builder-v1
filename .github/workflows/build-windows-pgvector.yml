name: build-windows-pgvector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgvector:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PGVECTOR_VERSION: 0.8.7
      PGVECTOR_SHA256: cac0b10c360f05b2d521200105ba3697e773d4cd3731f5a915a7e37ebe0bea85
      POSTGRESQL_VERSION: 18.6
      POSTGRESQL_MAJOR: "18"
      POSTGRESQL_CORE_SHA256: f500d3df630bb450a83699f1ad1a46e2220f50360a44c36db5d1d434078ee263
      POSTGRESQL_CORE_URL: https://sbp.enterprisedb.com/getfile.jsp?fileid=1260609
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download pinned upstream inputs
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.7.tar.gz" -OutFile "pgvector.tar.gz"
          Invoke-WebRequest -UseBasicParsing -Uri "$env:POSTGRESQL_CORE_URL" -OutFile "postgresql-core.7z"
          $sourceHash = (Get-FileHash pgvector.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          $coreHash = (Get-FileHash postgresql-core.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $env:PGVECTOR_SHA256) { throw "pgvector archive digest mismatch" }
          if ($coreHash -ne $env:POSTGRESQL_CORE_SHA256) { throw "PostgreSQL core archive digest mismatch" }
      - name: Locate 7-Zip
        shell: pwsh
        run: |
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $seven)) {
            choco install 7zip -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $seven)) { throw '7-Zip installation is unavailable' }
          "SEVEN_ZIP=$seven" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install packaging dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Build pgvector install handoff
        shell: pwsh
        run: |
          & .\runtime-windows\build_pgvector_v2.ps1 -SourceArchive .\pgvector.tar.gz -CoreArchive .\postgresql-core.7z -OutputDir .\pgvector-build -ExpectedSourceSha256 $env:PGVECTOR_SHA256 -ExpectedCoreArchiveSha256 $env:POSTGRESQL_CORE_SHA256 -SourceVersion $env:PGVECTOR_VERSION -PostgresqlMajor $env:POSTGRESQL_MAJOR -SevenZip $env:SEVEN_ZIP
          if ($LASTEXITCODE -ne 0) { throw "pgvector build producer failed" }
      - name: Write exact module binding
        shell: pwsh
        run: |
          @'
          {
            "runtime_version": "v2",
            "os": "windows",
            "kind": "postgresql-extension",
            "name": "vector",
            "version": "0.8.7",
            "arch": "x64",
            "build_revision": 0,
            "host": {"type": "postgresql", "series": "18", "abi": {"major": 18}}
          }
          '@ | Set-Content -LiteralPath pgvector-identity.json -Encoding utf8
          @'
          {"sha256": "f500d3df630bb450a83699f1ad1a46e2220f50360a44c36db5d1d434078ee263", "version": "18.6", "series": "18"}
          '@ | Set-Content -LiteralPath pgvector-core.json -Encoding utf8
      - name: Package diagnostic module
        shell: pwsh
        run: |
          python .\runtime-windows\repack_pgvector_v2.py --build-dir .\pgvector-build --identity .\pgvector-identity.json --core .\pgvector-core.json --output-dir .\pgvector-output --seven-zip $env:SEVEN_ZIP
          if ($LASTEXITCODE -ne 0) { throw "pgvector module repack failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: pgvector-0.8.7-pgsql18-windows-x86_64
          if-no-files-found: error
          path: |
            pgvector-output/**
            pgvector-build/build-audit.json
            pgvector-build/build.log
