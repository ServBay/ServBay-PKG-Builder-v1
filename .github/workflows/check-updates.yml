name: check-updates

on:
  schedule:
    # Daily at 18:00 UTC (02:00 Beijing). Checking daily keeps each run's update
    # batch small, avoiding a large one-shot compile backlog vs a weekly cadence.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      runtime_version:
        description: 'Runtime update profile (all expands to v1 and opt-in v2 checks)'
        type: choice
        options: [v1, v2, all]
        default: v1
      target:
        description: 'Platforms to check'
        type: choice
        options: [all, macos, windows]
        default: all
      continue_build:
        description: 'Build and dispatch after config update'
        type: boolean
        default: false
      upload_dry_run:
        description: 'Pass dry_run=true to Uploader'
        type: boolean
        default: true
      pending_only:
        description: 'Internal continuation: compile pending identities without refreshing versions'
        type: boolean
        default: false
      full_rebuild:
        description: 'Use all active versions (v2 skips already build-ready identities)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      macos_count: ${{ steps.plan.outputs.macos_count }}
      macos_records: ${{ steps.plan.outputs.macos_records }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
      windows_count: ${{ steps.plan.outputs.windows_count }}
      should_build: ${{ steps.plan.outputs.should_build }}
      upload_dry_run: ${{ steps.plan.outputs.upload_dry_run }}
      runtime_version: ${{ steps.mode.outputs.runtime_version }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      dispatch_pending: ${{ steps.plan.outputs.dispatch_pending }}
      allow_modules: ${{ steps.plan.outputs.allow_modules }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runtime_version == 'v2' && github.sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install requests

      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_CONTINUE_BUILD: ${{ inputs.continue_build }}
          INPUT_UPLOAD_DRY_RUN: ${{ inputs.upload_dry_run }}
          INPUT_FULL_REBUILD: ${{ inputs.full_rebuild }}
          INPUT_PENDING_ONLY: ${{ inputs.pending_only }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            runtime_version="v1"
            target="all"
            continue_build="true"
            upload_dry_run="false"
            full_rebuild="false"
            pending_only="false"
          else
            runtime_version="${INPUT_RUNTIME_VERSION:-v1}"
            target="${INPUT_TARGET:-all}"
            continue_build="${INPUT_CONTINUE_BUILD:-false}"
            upload_dry_run="${INPUT_UPLOAD_DRY_RUN:-true}"
            full_rebuild="${INPUT_FULL_REBUILD:-false}"
            pending_only="${INPUT_PENDING_ONLY:-false}"
          fi

          if [ "$pending_only" = true ] && [ "$runtime_version" != v2 ]; then
            echo '::error::pending_only requires Runtime v2'; exit 1
          fi
          case "$runtime_version" in v1|v2|all) ;; *) echo '::error::Invalid runtime profile'; exit 1 ;; esac
          if [ "$runtime_version" = all ]; then
            case "$target" in all|macos) ;; *) echo '::error::all requires a macOS update check'; exit 1 ;; esac
            # This run retains v1 behavior; refresh-v2 dispatches the explicit second profile.
            runtime_version="v1"
          fi
          if [ "$runtime_version" = v2 ]; then
            if [ "$target" = windows ]; then
              echo '::error::The macOS v2 profile cannot select the Windows v1 workflow.'
              exit 1
            fi
            target="macos"
          fi
          case "$target" in all|macos|windows) ;; *) target="all" ;; esac
          case "$continue_build" in true|false) ;; *) continue_build="false" ;; esac
          case "$upload_dry_run" in true|false) ;; *) upload_dry_run="true" ;; esac
          case "$full_rebuild" in true|false) ;; *) full_rebuild="false" ;; esac

          {
            echo "runtime_version=$runtime_version"
            echo "target=$target"
            echo "continue_build=$continue_build"
            echo "upload_dry_run=$upload_dry_run"
            echo "full_rebuild=$full_rebuild"
            echo "pending_only=$pending_only"
          } >> "$GITHUB_OUTPUT"

          echo "target=$target continue_build=$continue_build upload_dry_run=$upload_dry_run full_rebuild=$full_rebuild"

      - name: Check package updates
        env:
          TARGET: ${{ steps.mode.outputs.target }}
          RUNTIME_VERSION: ${{ steps.mode.outputs.runtime_version }}
          FULL_REBUILD: ${{ steps.mode.outputs.full_rebuild }}
          PENDING_ONLY: ${{ steps.mode.outputs.pending_only }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || github.token }}
        run: |
          set -euo pipefail
          printf '{"include":[]}\n' > macos-matrix.json
          printf '{"include":[]}\n' > windows-matrix.json

          all_flag=()
          if [ "$FULL_REBUILD" = "true" ]; then
            all_flag=(--all)
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "macos" ]; then
            if [ "$RUNTIME_VERSION" = v2 ]; then
              pending_flag=()
              if [ "$PENDING_ONLY" = true ]; then pending_flag=(--pending-only); fi
              python3 runtime/update_packages.py --runtime-version v2 "${pending_flag[@]}" \
                --conf runtime-v2/config/packages.conf --all --emit-json-file macos-desired.json
              if [ "$PENDING_ONLY" != true ]; then
                python3 runtime-v2/ci/update_modules.py --config runtime-v2/config/modules.json \
                  --packages-conf runtime-v2/config/packages.conf --output module-updates.json
              fi
            else
              python3 runtime/update_packages.py \
                --conf runtime/packages.conf --emit-json-file macos-matrix.json "${all_flag[@]}"
            fi
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "windows" ]; then
            python3 runtime-windows/update_packages.py \
              --conf runtime-windows/windows-packages.txt \
              --emit-json-file windows-matrix.json \
              "${all_flag[@]}"
          fi

          echo "--- macos matrix ---"
          cat macos-matrix.json
          echo "--- windows matrix ---"
          cat windows-matrix.json

      - name: Commit updated configs
        if: ${{ steps.mode.outputs.pending_only != 'true' }}
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/packages.conf runtime-windows/windows-packages.txt runtime-v2/config/packages.conf runtime-v2/config/modules.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package config changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/packages.conf runtime-windows/windows-packages.txt runtime-v2/config/packages.conf runtime-v2/config/modules.json
          git commit -m "chore: update package configs"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Persist Runtime v2 discovery and resolve pending builds
        if: ${{ steps.mode.outputs.runtime_version == 'v2' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 runtime/ci/build_state.py plan --state runtime-v2/config/build-state.json \
            --records macos-desired.json --matrix macos-matrix.json \
            --repository "$GITHUB_REPOSITORY" --persist

      - name: Prepare build plan
        id: plan
        env:
          RUNTIME_VERSION: ${{ steps.mode.outputs.runtime_version }}
          CONTINUE_BUILD: ${{ steps.mode.outputs.continue_build }}
          UPLOAD_DRY_RUN: ${{ steps.mode.outputs.upload_dry_run }}
          PENDING_ONLY: ${{ steps.mode.outputs.pending_only }}
          CONFIG_CHANGED: ${{ steps.commit.outputs.changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "runtime/ci")
          import build_control
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          decision = build_control.run_decision(os.environ["RUNTIME_VERSION"], os.environ["PENDING_ONLY"] == "true",
              os.environ["CONFIG_CHANGED"] == "true", os.environ["CONTINUE_BUILD"] == "true",
              os.environ.get("GITHUB_SHA"), checkout)
          records = json.loads(Path("macos-matrix.json").read_text())
          if os.environ["RUNTIME_VERSION"] == "v2":
              import build_profile, build_state
              # Discovery may include future concurrent config updates; only this checkout can supply inputs.
              available, missing = [], []
              for row in records["include"]:
                  try:
                      build_profile.profile_record("runtime-v2/config/packages.conf", row.get("recipe_name", row["name"]), row["version"])
                      available.append(row)
                  except ValueError:
                      missing.append(row)
              reserved = {"include": [], "deferred": [], "diagnostics": []}
              if decision["build_allowed"]:
                  producer = {"commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])}
                  reserved = build_state.reserve_github(available, producer, os.environ["GITHUB_REPOSITORY"],
                      Path(os.environ["RUNNER_TEMP"]) / "v2-reservation-recovery", max_groups=256)
              scheduled = build_profile.workflow_plan(reserved["include"])
              records = {"include": scheduled["records"]}
              matrix = scheduled["matrix"]
              print(f"macos_deferred={len(reserved['deferred']) + len(missing)}")
              print("reservation_diagnostics=" + json.dumps(reserved["diagnostics"], separators=(",", ":")))
          else:
              matrix = records
          Path("macos-matrix.json").write_text(json.dumps(records))
          windows = json.loads(Path("windows-matrix.json").read_text())
          print("macos_records=" + json.dumps(records, separators=(",", ":")))
          print("macos_matrix=" + json.dumps(matrix, separators=(",", ":")))
          print("macos_count=" + str(len(matrix["include"])))
          print("windows_matrix=" + json.dumps(windows, separators=(",", ":")))
          print("windows_count=" + str(len(windows["include"])))
          print("should_build=" + str(decision["build_allowed"] and bool(records["include"] or windows["include"])).lower())
          print("dispatch_pending=" + str(decision["dispatch_pending"]).lower())
          print("allow_modules=" + str(os.environ["RUNTIME_VERSION"] == "v2" and decision["build_allowed"]).lower())
          print("checkout_ref=" + (os.environ["GITHUB_SHA"] if os.environ["RUNTIME_VERSION"] == "v2" else checkout))
          print("upload_dry_run=" + os.environ["UPLOAD_DRY_RUN"])
          PY


  refresh-v2:
    # Serialize configuration pushes; v1 compilation can continue independently.
    needs: check
    if: ${{ !cancelled() && ((github.event_name == 'schedule' && vars.V2_PACKAGE_SCHEDULE_MODE != '' && vars.V2_PACKAGE_SCHEDULE_MODE != 'off') || (github.event_name == 'workflow_dispatch' && inputs.runtime_version == 'all')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dispatch one explicit Runtime v2 refresh
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PENDING_ONLY: ${{ inputs.pending_only }}
          INPUT_CONTINUE_BUILD: ${{ inputs.continue_build }}
          INPUT_UPLOAD_DRY_RUN: ${{ inputs.upload_dry_run }}
          INPUT_FULL_REBUILD: ${{ inputs.full_rebuild }}
          V2_PACKAGE_SCHEDULE_MODE: ${{ vars.V2_PACKAGE_SCHEDULE_MODE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'runtime/ci')
          import build_control
          build_control.dispatch_refresh(os.environ['GITHUB_REPOSITORY'],
              event_name=os.environ['EVENT_NAME'], runtime_version=os.environ['INPUT_RUNTIME_VERSION'],
              target=os.environ['INPUT_TARGET'], pending_only=os.environ['INPUT_PENDING_ONLY'] == 'true',
              continue_build=os.environ['INPUT_CONTINUE_BUILD'] == 'true',
              dry_run=os.environ['INPUT_UPLOAD_DRY_RUN'] != 'false',
              full_rebuild=os.environ['INPUT_FULL_REBUILD'] == 'true',
              schedule_mode=os.environ['V2_PACKAGE_SCHEDULE_MODE'])
          PY

  continue-pending-v2:
    needs: check
    if: ${{ needs.check.outputs.dispatch_pending == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.check.outputs.upload_dry_run }}
        run: python3 runtime/ci/build_control.py --repository "$GITHUB_REPOSITORY" --upload-dry-run "$DRY_RUN"

  build-macos:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' && needs.check.outputs.macos_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.macos_matrix) }}
    uses: ./.github/workflows/build-macos.yml
    with:
      runtime_version: ${{ needs.check.outputs.runtime_version }}
      build_revision: ${{ matrix.build_revision || 0 }}
      pkg: ${{ matrix.recipe_name || matrix.name }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      checkout_ref: ${{ needs.check.outputs.checkout_ref }}
    secrets: inherit

  plan-module-hosts:
    needs: check
    if: ${{ needs.check.outputs.allow_modules == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
      count: ${{ steps.hosts.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.checkout_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install requests
      - name: Resolve existing exact hosts for independent module updates
        id: hosts
        env:
          PACKAGE_CATALOG_URL: ${{ vars.PACKAGE_CATALOG_URL }}
          SELECTED_CORES: ${{ needs.check.outputs.macos_records }}
          BASE_VERSION_X86_64: ${{ vars.BASE_V2_VERSION_X86_64 }}
          BASE_VERSION_ARM64: ${{ vars.BASE_V2_VERSION_ARM64 }}
          BASE_RUNTIME_X86_64: ${{ vars.BASE_V2_SHA256_RUNTIME_X86_64 }}
          BASE_RUNTIME_ARM64: ${{ vars.BASE_V2_SHA256_RUNTIME_ARM64 }}
          BASE_DEVLIB_X86_64: ${{ vars.BASE_V2_SHA256_DEVLIB_X86_64 }}
          BASE_DEVLIB_ARM64: ${{ vars.BASE_V2_SHA256_DEVLIB_ARM64 }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'runtime-v2/ci')
          import module_pipeline
          bases = {arch: {'version': os.environ['BASE_VERSION_' + arch.upper()],
                          'runtime_sha256': os.environ['BASE_RUNTIME_' + arch.upper()],
                          'devlib_sha256': os.environ['BASE_DEVLIB_' + arch.upper()]} for arch in ('x86_64', 'arm64')}
          matrix = module_pipeline.host_request_matrix('runtime-v2/config/packages.conf',
              json.loads(os.environ['SELECTED_CORES'])['include'], bases, os.environ['PACKAGE_CATALOG_URL'])
          print('matrix=' + json.dumps(matrix, separators=(',', ':')))
          print('count=' + str(len(matrix['include'])))
          PYCODE

  build-module-hosts:
    needs: [check, plan-module-hosts]
    if: ${{ needs.plan-module-hosts.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-module-hosts.outputs.matrix) }}
    uses: ./.github/workflows/build-macos.yml
    with:
      runtime_version: v2
      pkg: ${{ matrix.pkg }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      host_request: ${{ toJSON(matrix.host_request) }}
      checkout_ref: ${{ needs.check.outputs.checkout_ref }}
    secrets: inherit

  build-windows:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' && needs.check.outputs.windows_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.windows_matrix) }}
    uses: ./.github/workflows/build-windows.yml
    with:
      pkg: ${{ matrix.name }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      version_type: ${{ matrix.version_type }}
      checkout_ref: main
    secrets: inherit

  collect-macos-v2:
    needs: [check, build-macos, plan-module-hosts, build-module-hosts]
    if: ${{ always() && needs.check.outputs.runtime_version == 'v2' && needs.check.outputs.allow_modules == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      ready_count: ${{ steps.collect.outputs.ready_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.checkout_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_COMMIT: ${{ needs.check.outputs.checkout_ref }}
          INCLUDE_CURRENT_RUN_MODULES: 'true'
          BUILD_RECORDS_JSON: ${{ needs.check.outputs.macos_records }}
        run: /bin/bash runtime/ci/collect_builds.sh

  dispatch-downstream:
    needs: [check, build-macos, build-module-hosts, build-windows, collect-macos-v2]
    # A single failed matrix leg (one package that won't build) must NOT block
    # publishing the packages that DID build. Fire whenever a build was requested
    # and neither platform was cancelled, then decide by what actually produced an
    # artifact (next step) rather than the aggregate build-* job result, which is
    # 'failure' if ANY matrix leg failed.
    if: >-
      ${{ always() && (
          (needs.check.outputs.runtime_version == 'v2' && needs.collect-macos-v2.result == 'success'
            && needs.collect-macos-v2.outputs.ready_count != '0')
          || (needs.check.outputs.runtime_version != 'v2' && needs.check.outputs.should_build == 'true'
            && needs.build-macos.result != 'cancelled' && needs.build-windows.result != 'cancelled') ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Count this run's package artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          RUNTIME_VERSION: ${{ needs.check.outputs.runtime_version }}
          READY_COUNT: ${{ needs.collect-macos-v2.outputs.ready_count }}
        run: |
          set -euo pipefail
          if [ "$RUNTIME_VERSION" = v2 ]; then
            echo "count=$READY_COUNT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sum the per-page counts of pkg-* artifacts (both pkg-macos-* and
          # pkg-windows-*). Failed packages produce no artifact, so a count > 0
          # means at least one package built and is worth publishing.
          count="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("pkg-"))] | length' \
            | awk '{s+=$1} END {print s+0}')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "package artifacts produced by this run: ${count}"
      - name: Signal downstream to fetch and publish
        if: ${{ steps.artifacts.outputs.count != '0' }}
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          TARGET_REPO: ${{ vars.TARGET_REPO || secrets.TARGET_REPO }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNTIME_VERSION: ${{ needs.check.outputs.runtime_version }}
          PRODUCER_COMMIT: ${{ needs.check.outputs.checkout_ref }}
          DRY_RUN: ${{ needs.check.outputs.upload_dry_run }}
        run: |
          set -euo pipefail
          : "${DISPATCH_PAT:?DISPATCH_PAT secret is not set}"
          : "${TARGET_REPO:?TARGET_REPO variable/secret is not set}"
          payload="$(python3 - <<'PY'
          import json, os
          data = {'run_id': os.environ['RUN_ID'], 'dry_run': os.environ['DRY_RUN']}
          if os.environ['RUNTIME_VERSION'] == 'v2':
              data.update(runtime_version='v2', os='macos', run_attempt=int(os.environ['RUN_ATTEMPT']),
                          producer_commit=os.environ['PRODUCER_COMMIT'])
          print(json.dumps({'event_type': 'builder-build-complete', 'client_payload': data}))
          PY
          )"
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${DISPATCH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "$payload"
