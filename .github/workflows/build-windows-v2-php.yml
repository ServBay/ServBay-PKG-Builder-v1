name: build-windows-v2-php

on:
  workflow_dispatch:
    inputs:
      module_revision:
        description: Explicit API-reviewed unoccupied module revision (RC4 core remains revision 0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  php-rc4:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout reviewed split collector
        uses: actions/checkout@v4
        with:
          repository: ServBay/PHP-Windows-Portable
          ref: b614c80d50c417f22a92a78be2540c750c7559f8
          path: php-portable
          persist-credentials: false
      - name: Checkout exact original producer configuration
        uses: actions/checkout@v4
        with:
          repository: ServBay/PHP-Windows-Portable
          ref: 5f5af83f797ae89a7187ddca87492cf8064d68d7
          path: php-producer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Collect original run 40272362001 attempt 1 and validate both payload generations
        id: php
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_DISPATCH_PAT || github.token }}
          MODULE_REVISION: ${{ inputs.module_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          @{
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 handoff-producer.json
          python -B runtime-windows/ci/php_v2_pipeline.py `
            --portable-source php-portable `
            --producer-source php-producer `
            --handoff-producer handoff-producer.json `
            --module-revision "$env:MODULE_REVISION" `
            --seven-zip "$sevenZip" `
            --output-dir php-v2-output
          if ($LASTEXITCODE -ne 0) { throw 'PHP native pipeline failed' }
          Get-Content php-v2-output/handoff-outputs.txt | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Export verified core
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.php.outputs.core }}
          path: php-v2-output/${{ steps.php.outputs.core }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Export verified module_01
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.php.outputs.module_01 }}
          path: php-v2-output/${{ steps.php.outputs.module_01 }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Export verified module_02
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.php.outputs.module_02 }}
          path: php-v2-output/${{ steps.php.outputs.module_02 }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Export verified module_03
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.php.outputs.module_03 }}
          path: php-v2-output/${{ steps.php.outputs.module_03 }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Export verified module_04
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.php.outputs.module_04 }}
          path: php-v2-output/${{ steps.php.outputs.module_04 }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Export verified module_05
        uses: actions/upload-artifact@v4
